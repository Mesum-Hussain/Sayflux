apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. Default is "debug", "debugOptimized".
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "liteDebugOptimized", "prodDebug", "prodDebugOptimized"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "app.whistleflux"
    defaultConfig {
        applicationId "app.whistleflux"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "0.1.0"
        // Only package native code (React Native, the speech engine) for the architectures we build.
        ndk { abiFilters(*reactNativeArchitectures.split(",")) }
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Caution! In production, you need to generate your own keystore file.
            // see https://reactnative.dev/docs/signed-apk-android.
            signingConfig signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

// Downloads url to dest once and checks its SHA-256, so a changed or corrupted file fails the build.
def fetchVerified = { String url, String sha256, File dest ->
    if (dest.exists()) return
    logger.lifecycle("Downloading ${url}")
    dest.parentFile.mkdirs()
    def tmp = new File("${dest.path}.part")
    new URL(url).withInputStream { input -> tmp.withOutputStream { it << input } }
    def md = java.security.MessageDigest.getInstance("SHA-256")
    tmp.withInputStream { input ->
        byte[] buf = new byte[1 << 20]
        int n
        while ((n = input.read(buf)) > 0) md.update(buf, 0, n)
    }
    def digest = md.digest().encodeHex().toString()
    if (digest != sha256) {
        tmp.delete()
        throw new GradleException("${dest.name} download has the wrong SHA-256: ${digest}")
    }
    tmp.renameTo(dest)
}

// Cactus's Needle engine runs the speech model. Its Android build is a static library and
// header (arm64 only), downloaded once into app/libs/ from a pinned commit and linked into
// libwhistleflux_speech.so by src/main/cpp/CMakeLists.txt.
def needleRepo = "https://huggingface.co/Cactus-Compute/needle3/resolve/3391a1007e7db31d2fe5c69c734bbe93a9c1ce79"
def needleDir = file("libs/needle-3.3.2/android-arm64")
fetchVerified("${needleRepo}/android-arm64/libneedle.a",
        "f862e2d58fbf4229c58678c492f73721d64ae4fdee023b91db155f04decae3f1", new File(needleDir, "libneedle.a"))
fetchVerified("${needleRepo}/android-arm64/needle.h",
        "a27dac4b3239eead91d124b7f7dbce5495c13019903fd817b68c16d39b055a99", new File(needleDir, "needle.h"))

android {
    externalNativeBuild {
        cmake { path "src/main/cpp/CMakeLists.txt" }
    }
    defaultConfig {
        externalNativeBuild {
            cmake { arguments "-DNEEDLE_DIR=${needleDir.absolutePath}", "-DANDROID_STL=c++_shared" }
        }
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
}

// The speech model ships inside the app (assets/models/whistle.cact, 17 MB), so it works
// right after install with no download. Same model as the desktop app (src/whistleflux/speech.py).
def speechModelUrl = "https://huggingface.co/Cactus-Compute/whistle/resolve/741118687e1f008f06d1351a402a731274789790/whistle.cact"
def speechModelSha256 = "b6e02f048568ac5d01a2042556c658061e699acbc0aa2a1439f52f3d461dffeb"
def speechModelAssets = layout.buildDirectory.dir("generated/speechModel/assets").get().asFile

def prepareSpeechModel = tasks.register("prepareSpeechModel") {
    description = "Downloads the Whistle speech model into the app's assets."
    def cached = file("${rootDir}/.speech-model/whistle-${speechModelSha256.take(12)}.cact")
    outputs.dir(speechModelAssets)
    inputs.property("sha256", speechModelSha256)
    doLast {
        fetchVerified(speechModelUrl, speechModelSha256, cached)
        delete(speechModelAssets)
        copy {
            from(cached)
            into(new File(speechModelAssets, "models"))
            rename { "whistle.cact" }
        }
    }
}

android.sourceSets.main.assets.srcDir(speechModelAssets)
tasks.named("preBuild") { dependsOn(prepareSpeechModel) }

// English word list for the keyboard's suggestions and swipe typing: AOSP's keyboard
// dictionary (Apache 2.0), pinned to a commit and checked against its SHA-256. Kept: plain
// words (letters and apostrophes) with frequency 20 or more, minus anything AOSP marks
// offensive. Written as "word<TAB>frequency" lines, most frequent first.
def dictionaryCommit = "127336e9f29d69607eab55982324b210279ae8c5"
def dictionaryUrl = "https://android.googlesource.com/platform/packages/inputmethods/LatinIME/+/${dictionaryCommit}/dictionaries/en_US_wordlist.combined.gz?format=TEXT"
def dictionarySha256 = "0f78dd455b532be169a23f233227b811fabced4b5bd7fc9c40cc05839793bcbd"
def dictionaryAssets = layout.buildDirectory.dir("generated/dictionary/assets").get().asFile

def prepareDictionary = tasks.register("prepareDictionary") {
    description = "Downloads AOSP's English word list and writes the keyboard's word file."
    def cached = file("${rootDir}/.speech-model/en_US_wordlist-${dictionarySha256.take(12)}.gz")
    outputs.dir(dictionaryAssets)
    inputs.property("sha256", dictionarySha256)
    doLast {
        if (!cached.exists()) {
            logger.lifecycle("Downloading ${dictionaryUrl}")
            // Gitiles serves raw files base64-encoded.
            def bytes = java.util.Base64.mimeDecoder.decode(new URL(dictionaryUrl).text.trim())
            def digest = java.security.MessageDigest.getInstance("SHA-256").digest(bytes).encodeHex().toString()
            if (digest != dictionarySha256) {
                throw new GradleException("Word list download has the wrong SHA-256: ${digest}")
            }
            cached.parentFile.mkdirs()
            cached.bytes = bytes
        }
        def words = []
        def line = ~/^ word=([^,]+),f=(\d+),flags=([^,]*)(.*)$/
        new java.util.zip.GZIPInputStream(new FileInputStream(cached)).withReader("UTF-8") { reader ->
            reader.eachLine { s ->
                def m = s =~ line
                if (!m.matches()) return
                def word = m.group(1)
                def freq = m.group(2) as int
                def flags = m.group(3)
                if (m.group(4).contains("possibly_offensive=true") || flags in ["offensive", "nonword"]) return
                if (freq < 20 || !(word ==~ /[A-Za-z][A-Za-z']*/)) return
                words << [word, freq]
            }
        }
        words.sort { a, b -> b[1] <=> a[1] }
        delete(dictionaryAssets)
        def out = new File(dictionaryAssets, "dictionaries/en_words.txt")
        out.parentFile.mkdirs()
        out.withWriter("UTF-8") { w -> words.each { w.write("${it[0]}\t${it[1]}\n") } }
        logger.lifecycle("Wrote ${words.size()} words to ${out}")
    }
}

android.sourceSets.main.assets.srcDir(dictionaryAssets)
tasks.named("preBuild") { dependsOn(prepareDictionary) }
// GestureDecoderTest reads the generated word file.
tasks.withType(Test).configureEach { dependsOn(prepareDictionary) }

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    testImplementation("junit:junit:4.13.2")
    testImplementation("org.json:json:20260814") // Android's own org.json is a stub in unit tests
    // On-phone test of the speech engine (see the README: connectedAndroidTest would uninstall the app)
    androidTestImplementation("androidx.test:runner:1.7.0")
    androidTestImplementation("androidx.test.ext:junit:1.3.0")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
